            min-height: 100vh;

        .card {

            width: 20px;

        }

        .logo-text {
            font-family: 'DM Serif Display', serif;

        h1 {

        }

            flex: 1;
            padding: 10px;

            font-weight: 500;

            transition: all .25s;
            color: var(--muted);
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif
        }

        .tab.active {
            background: var(--blue);
            color: var(--white);
            box-shadow: 0 4px 16px rgba(30, 111, 255, .3)
        }

        .form-group {
            margin-bottom: 20px

        label {
            display: block;

        input {

            background: rgba(255, 255, 255, .05);

            padding: 13px 16px;

            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all .25s

        input:focus {
            border-color: rgba(30, 111, 255, .5);

            box-shadow: 0 0 0 4px rgba(30, 111, 255, .08)
        }

        input::placeholder {
            color: var(--muted)
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            border: none;
            border-radius: 10px;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .25s;
            box-shadow: 0 4px 20px rgba(30, 111, 255, .3);
            margin-top: 8px
        }

        .btn:hover {
            background: var(--blue2);
            transform: translateY(-1px)
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none
        }

        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: none
        }

        .msg.error {
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .2);
            color: #fca5a5
        }

        .msg.success {
            background: rgba(74, 222, 128, .1);
            border: 1px solid rgba(74, 222, 128, .2);
            color: #86efac
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
            margin-top: 24px;
            transition: color .2s
        }

        .back:hover {
            color: var(--gold)
        }

        .panel {
            display: none
        }

        .panel.active {
            display: block
        }
    </style>

<body>
    <div class="card">
        <a href="/" class="logo">
            <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5Z" fill="#fff" />
                </svg></div>
            <span class="logo-text">Luminary Academy</span>
        </a>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue your AI learning journey.</p>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" onclick="switchTab('signup')">Sign Up</button>
        </div>
        <div id="msg" class="msg"></div>
        <div class="panel active" id="panel-signin">
            <div class="form-group"><label>Email address</label><input type="email" id="si-email"
                    placeholder="you@example.com"></div>
            <div class="form-group"><label>Password</label><input type="password" id="si-password"
                    placeholder="Your password"></div>
            <button class="btn" id="signinBtn" onclick="signIn()">Sign In →</button>
        </div>
        <div class="panel" id="panel-signup">
            <div class="form-group"><label>Full name</label><input type="text" id="su-name"
                    placeholder="Your full name"></div>
            <div class="form-group"><label>Email address</label><input type="email" id="su-email"
                    placeholder="you@example.com"></div>
            <div class="form-group"><label>Password</label><input type="password" id="su-password"
                    placeholder="Min 6 characters"></div>
            <button class="btn" id="signupBtn" onclick="signUp()">Create Account →</button>
        </div>
        <a href="/" class="back">← Back to Luminary Academy</a>
    </div>
    <script>
        const SUPABASE_URL = 'https://txgtmdkhhvgctujvqlnk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aKIegyARnJpsYb1FDwsQ_g_ta4DXNZW';
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
        sb.auth.getSession().then(({ data }) => {
            if (data.session) window.location.href = '/dashboard.html';
        });
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'signin') || (i === 1 && tab === 'signup')));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + tab).classList.add('active');
            hideMsg();
        }
        function showMsg(text, type = 'error') {
            const m = document.getElementById('msg');
            m.textContent = text; m.className = 'msg ' + type; m.style.display = 'block';
        }
        function hideMsg() { document.getElementById('msg').style.display = 'none'; }
        async function signIn() {
            const email = document.getElementById('si-email').value.trim();
            const password = document.getElementById('si-password').value;
            if (!email || !password) return showMsg('Please enter email and password.');
            const btn = document.getElementById('signinBtn');
            btn.disabled = true; btn.textContent = 'Signing in...';
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) { showMsg(error.message); btn.disabled = false; btn.textContent = 'Sign In →'; return; }
            window.location.href = '/dashboard.html';
        }
        async function signUp() {
            const full_name = document.getElementById('su-name').value.trim();
            const email = document.getElementById('su-email').value.trim();
            const password = document.getElementById('su-password').value;
            if (!full_name || !email || !password) return showMsg('Please fill in all fields.');
            if (password.length < 6) return showMsg('Password must be at least 6 characters.');
            const btn = document.getElementById('signupBtn');
            btn.disabled = true; btn.textContent = 'Creating account...';
            const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name } } });
            if (error) { showMsg(error.message); btn.disabled = false; btn.textContent = 'Create Account →'; return; }
            showMsg('Account created! Check your email to verify, then sign in.', 'success');
            btn.disabled = false; btn.textContent = 'Create Account →';
            setTimeout(() => switchTab('signin'), 3000);
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const active = document.querySelector('.panel.active').id;
                if (active === 'panel-signin') signIn();
                else signUp();
            }
        });
    </script>
</body>

</html>
